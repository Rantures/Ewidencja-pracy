<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#f5f5f7;background:#0f1014}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#111318,#0b0c0f);min-height:100vh}
.wrap{max-width:680px;margin:auto;padding:20px 16px 40px}h1{font-size:30px;margin:8px 0 4px}.sub{color:#9b9da6;margin-bottom:22px}
.card{background:#17191f;border:1px solid #292c34;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 30px #0004}
label{display:block;font-size:13px;color:#a9abb4;margin:0 0 7px}input,select{width:100%;background:#101217;color:#fff;border:1px solid #343741;border-radius:13px;padding:13px;font-size:17px;outline:none}input[type="date"]{text-align:left;min-height:52px;height:52px;line-height:24px;-webkit-appearance:none;appearance:none;display:block}

.split{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}.pill{background:#22252c;border-radius:9px;padding:4px 7px;font-size:12px;color:#c8cad1}.pill.day{color:#d8e8ff}.pill.night{color:#d8c7ff}

.hidden{display:none!important}.login{max-width:440px;margin:12vh auto;padding:20px}.version{text-align:center;color:#666a73;font-size:11px;padding:8px 0 2px}table{width:100%;border-collapse:collapse;font-size:14px;table-layout:auto;min-width:100%}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #2b2e35;vertical-align:middle;white-space:nowrap}th{color:#aeb0b8}#reportHead th:first-child,#report td:first-child{width:82px}#reportHead th:nth-child(2),#report td:nth-child(2){width:92px}#reportHead th:nth-child(3),#report td:nth-child(3){width:72px}#reportHead th:nth-child(4),#report td:nth-child(4){width:65px}#reportHead th:last-child,#report td:last-child{width:82px}.collapse-btn{width:auto!important;padding:9px 13px;font-size:14px}.collapsed{display:none!important}
@media(max-width:420px){h1{font-size:27px}.grid2{grid-template-columns:1fr}.entry{grid-template-columns:1fr}.entry .row{justify-content:flex-start}}

.diet-week .week-main{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.diet-week .week-title{font-weight:700;font-size:17px}.diet-week .week-date{color:#9b9da6;font-size:13px;margin-top:3px}.diet-week .week-hours{font-size:20px;font-weight:700;text-align:right}.diet-week .week-status{font-size:12px;margin-top:3px;text-align:right;color:#9b9da6}.diet-week.received .week-status{color:#b9efc2}
.diet-details{border-top:1px solid #315f39;margin-top:13px;padding-top:11px}.diet-day{display:flex;justify-content:space-between;gap:8px;padding:7px 0;font-size:14px}.diet-day .muted{font-size:13px}.diet-actions{display:flex;gap:8px;margin-top:12px}.diet-actions button{flex:1}.diet-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.diet-summary .mini{background:#17191f;border:1px solid #292c34;border-radius:15px;padding:13px}.diet-summary .mini strong{display:block;font-size:22px;margin-top:3px}
</style>

<body>
<div id="loginView" class="login"><div class="card">
<h1>Ewidencja pracy</h1><div class="sub">Zaloguj się, żeby zobaczyć swoje godziny.</div>
<label>E-mail</label><input id="email" type="email" autocomplete="username"><div style="height:12px"></div>

<button class="btn primary" id="loginBtn">Zaloguj</button><div id="loginMsg" class="msg err"></div>
</div></div>

<div id="appView" class="wrap hidden"><div class="version" style="text-align:right;padding:0 4px 6px">v1.22</div>
<div class="row"><div><h1>Ewidencja pracy</h1><div class="sub" id="userEmail"></div></div><button class="btn secondary small" id="logoutBtn">Wyloguj</button></div>
<div class="navtabs"><button class="navtab active" id="hoursTab">Godziny</button><button class="navtab" id="dietTab">Diety</button></div>
<div id="hoursView">
<div class="card">
<div class="grid2"><div><label>Data</label><input id="date" type="date"></div>
<div><label>Przerwa</label><label class="check" style="margin-top:9px"><input id="break" type="checkbox" checked> 30 minut</label></div></div>
<div style="height:14px"></div>
<div class="grid2"><div><label>Od</label><div class="time"><select id="sh"></select><select id="sm"></select></div></div>
<div><label>Do</label><div class="time"><select id="eh"></select><select id="em"></select></div></div></div>
<div style="height:16px"></div><div class="row"><span class="muted">Czas pracy</span><span class="big" id="calc">0:00 h</span></div>
<div style="height:14px"></div><button class="btn primary" id="saveBtn">Zapisz dzień</button><div id="appMsg" class="msg"></div>
</div>

<div class="card"><div class="row"><strong>Okres rozliczeniowy</strong><button class="btn secondary small" id="currentMonthBtn">Bieżący</button></div>
<div style="height:12px"></div><div class="grid2">
<div><label>Miesiąc okresu</label><select id="filterMonth"></select></div><div><label>Rok</label><select id="filterYear"></select></div></div><div id="periodLabel" class="muted" style="margin-top:10px;font-size:13px"></div></div>

<div class="card"><div class="row"><strong>Zapisane dni</strong><div class="row"><span class="muted" id="count"></span><button class="btn secondary small collapse-btn" id="toggleEntries">Pokaż</button></div></div>

<div class="card"><div class="row"><strong>Dla księgowej</strong><button class="btn secondary small" id="copyBtn">Kopiuj tekst</button></div>

</div>
</div>
<div id="dietView" class="hidden">
<div class="card"><div class="row"><strong>Diety — tygodnie</strong><button class="btn secondary small" id="dietCurrentBtn">Bieżący</button></div>
<div style="height:12px"></div><div><label>Rok</label><select id="dietYear"></select></div>
<div id="dietPeriodLabel" class="muted" style="margin-top:10px;font-size:13px"></div></div>
<div id="dietWeeks"></div>
<div class="card diet-summary"><div class="mini"><span class="muted">Diety otrzymane</span><strong id="dietReceivedCount">0</strong></div><div class="mini"><span class="muted">Diety brakujące</span><strong id="dietMissingCount">0</strong></div></div>
</div>
</div>
<script>
const SUPABASE_URL="https://sofqzwpfsoeysouvklkm.supabase.co";
const SUPABASE_KEY="sb_publishable_k6BT46z0PkYpDq7a1Nx7yw_1r1tV641";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let entries=[],dietWeeks=[],openDietWeek=null;
function dateObj(s){let [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)}
function dateIso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function monday(d){let x=new Date(d),day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function shortDate(d){return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")}
function isoWeekParts(d){let x=new Date(d);x.setHours(12,0,0,0);let day=x.getDay()||7;let th=new Date(x);th.setDate(x.getDate()+4-day);let y=th.getFullYear();let first=new Date(y,0,4,12);let firstDay=first.getDay()||7;let firstThursday=new Date(first);firstThursday.setDate(first.getDate()+4-firstDay);return {year:y,week:1+Math.round((th-firstThursday)/604800000)}}
function isoWeekYear(d){return isoWeekParts(d).year}
function isoWeek(d){return isoWeekParts(d).week}
function isoWeeksInYear(y){return isoWeek(new Date(y,11,28,12))}
function weekStartFromISO(y,w){let jan4=new Date(y,0,4,12);return monday(addDays(jan4,(w-1)*7))}
function dietPeriodText(){let y=Number($("dietYear").value);return "Tygodnie ISO "+y+" (poniedziałek–niedziela)"}
async function loadDietWeeks(){let{data,error}=await db.from("diet_weeks").select("*").order("week_start",{ascending:true});if(error){showMsg("appMsg","Nie udało się pobrać diet: "+error.message);return}dietWeeks=data||[];renderDiet()}
function weekEntries(start,end){let a=dateIso(start),b=dateIso(end);return entries.filter(e=>e.work_date>=a&&e.work_date<=b)}
function renderDiet(){
 let y=Number($("dietYear").value);$("dietPeriodLabel").textContent=dietPeriodText();let weeks=[],count=isoWeeksInYear(y),now=new Date(),currentYear=isoWeekYear(now),currentWeek=isoWeek(now);
 for(let w=1;w<=count;w++){let ws=weekStartFromISO(y,w),we=addDays(ws,6);weeks.push({start:ws,end:we,num:w})}
 let received=0;
 $("dietWeeks").innerHTML=weeks.map((w,i)=>{let key=dateIso(w.start),saved=dietWeeks.find(x=>x.week_start===key),isReceived=!!saved?.received,isCurrent=y===currentYear&&w.num===currentWeek;if(isReceived)received++;let es=weekEntries(w.start,w.end),total=es.reduce((s,e)=>s+nmin(e.hours),0),open=openDietWeek===key;
 let details=open?'<div class="diet-details">'+(es.length?es.map(e=>'<div class="diet-day"><span><strong>'+shortDate(dateObj(e.work_date))+'</strong> <span class="muted">'+e.start_time.slice(0,5)+'–'+e.end_time.slice(0,5)+'</span></span><strong>'+fmt(nmin(e.hours))+'</strong></div>').join(""):'<div class="muted" style="padding:8px 0">Brak pracy w tym tygodniu.</div>')+'<div class="diet-actions"><button class="btn '+(isReceived?"secondary":"primary")+' small diet-toggle" data-week="'+key+'">'+(isReceived?"↩ Oznacz jako nieotrzymaną":"✅ Otrzymałem dietę")+'</button></div></div>':'';
 return '<div id="'+(isCurrent?"currentDietWeek":"")+'" class="diet-week '+(isReceived?"received ":"")+(isCurrent?"current":"")+'" data-open="'+key+'"><div class="week-main"><div><div class="week-title">'+(isReceived?"🟩":"⬜")+' Tydzień '+w.num+(isCurrent?'<span class="current-badge">AKTUALNY</span>':"")+'</div><div class="week-date">'+shortDate(w.start)+' – '+shortDate(w.end)+'</div></div><div><div class="week-hours">'+fmt(total)+'</div><div class="week-status">'+(isReceived?"Dieta otrzymana":"Dieta niepotwierdzona")+'</div></div></div>'+details+'</div>'}).join("");
 $("dietReceivedCount").textContent=received;$("dietMissingCount").textContent=weeks.length-received;
}
async function toggleDiet(weekStart){let{data:{user}}=await db.auth.getUser();if(!user)return;let existing=dietWeeks.find(x=>x.week_start===weekStart),received=!existing?.received;
 let{error}=await db.from("diet_weeks").upsert({user_id:user.id,week_start:weekStart,week_end:dateIso(addDays(dateObj(weekStart),6)),received},{onConflict:"user_id,week_start"});if(error){showMsg("appMsg","Nie udało się zapisać diety: "+error.message);return}await loadDietWeeks()}

function fillTimes(){for(let h=0;h<24;h++)for(const id of["sh","eh"]){let o=document.createElement("option");o.value=String(h).padStart(2,"0");o.textContent=o.value;$(id).appendChild(o)}for(const m of[0,30])for(const id of["sm","em"]){let o=document.createElement("option");o.value=String(m).padStart(2,"0");o.textContent=o.value;$(id).appendChild(o)}$("sh").value="06";$("eh").value="18"}
function minutes(h,m){return Number(h)*60+Number(m)}
function workMinutes(){let a=minutes($("sh").value,$("sm").value),b=minutes($("eh").value,$("em").value);if(b<=a)b+=1440;let x=b-a;if($("break").checked)x-=30;return Math.max(0,x)}
function fmt(min){let h=Math.floor(min/60),m=min%60;return h+":"+String(m).padStart(2,"0")+" h"}
function showMsg(id,text,ok=false){let e=$(id);e.textContent=text;e.className="msg "+(ok?"ok":"err");e.style.display="block";setTimeout(()=>e.style.display="none",3500)}
function updateCalc(){$("calc").textContent=fmt(workMinutes())}
function nmin(v){return Math.round(Number(v||0)*60)}
function periodBounds(){let y=Number($("filterYear").value),m=Number($("filterMonth").value);let end=new Date(y,m-1,20,12);let start=new Date(y,m-2,21,12);return {start,end}}function isoDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function periodText(){let{start,end}=periodBounds();return String(start.getDate()).padStart(2,"0")+"."+String(start.getMonth()+1).padStart(2,"0")+"."+start.getFullYear()+" – "+String(end.getDate()).padStart(2,"0")+"."+String(end.getMonth()+1).padStart(2,"0")+"."+end.getFullYear()}function visibleEntries(){let{start,end}=periodBounds(),a=isoDate(start),b=isoDate(end);return entries.filter(e=>e.work_date>=a&&e.work_date<=b)}function updatePeriodLabel(){$("periodLabel").textContent=periodText()}

async function loadEntries(){let{data,error}=await db.from("work_entries").select("*").order("work_date",{ascending:false});if(error){showMsg("appMsg","Nie udało się pobrać danych: "+error.message);return}entries=data||[];render()}
function render(){
let shown=visibleEntries();$("count").textContent=shown.length?shown.length+" dni":"";$("toggleEntries").textContent="Pokaż";$("entries").classList.add("collapsed");
$("entries").innerHTML=shown.length?shown.map(e=>{let day=nmin(e.day_hours),night=nmin(e.night_hours),total=nmin(e.hours);let split=(day?'<span class="pill day">☀️ Dzień '+fmt(day).replace(" h","")+'</span>':'')+(night?'<span class="pill night">🌙 Noc '+fmt(night).replace(" h","")+'</span>':'');return '<div class="entry"><div><div class="date">'+e.work_date+'</div><div class="muted">'+e.start_time.slice(0,5)+'–'+e.end_time.slice(0,5)+'</div><div class="split">'+split+'</div></div><div class="row"><span class="hours">'+fmt(total)+'</span><button class="delete" data-id="'+e.id+'">🗑️</button></div></div>'}).join(""):'<div class="muted" style="padding:16px 0">Brak zapisanych dni w tym miesiącu.</div>';
let total=shown.reduce((s,e)=>s+nmin(e.hours),0),day=shown.reduce((s,e)=>s+nmin(e.day_hours),0),night=shown.reduce((s,e)=>s+nmin(e.night_hours),0);
$("total").textContent=fmt(total);$("sumDay").textContent=fmt(day).replace(" h"," h");$("sumNight").textContent=night?fmt(night).replace(" h"," h"):"—";
const hasNight=shown.some(e=>nmin(e.night_hours)>0);$("reportHead").innerHTML=hasNight?'<tr><th>Data</th><th>Godziny</th><th>Dzień</th><th>Noc</th><th>Łącznie</th></tr>':'<tr><th>Data</th><th>Godziny</th><th>Łącznie</th></tr>';$("report").innerHTML=shown.map(e=>hasNight?'<tr><td>'+e.work_date+'</td><td>'+e.start_time.slice(0,5)+'–'+e.end_time.slice(0,5)+'</td><td>'+fmt(nmin(e.day_hours))+'</td><td>'+(nmin(e.night_hours)?fmt(nmin(e.night_hours)):"—")+'</td><td>'+fmt(nmin(e.hours))+'</td></tr>':'<tr><td>'+e.work_date+'</td><td>'+e.start_time.slice(0,5)+'–'+e.end_time.slice(0,5)+'</td><td>'+fmt(nmin(e.hours))+'</td></tr>').join("")
}
async function save(){
let date=$("date").value;if(!date){showMsg("appMsg","Wybierz datę.");return}let mins=workMinutes();if(mins<=0){showMsg("appMsg","Godzina zakończenia musi być późniejsza od rozpoczęcia.");return}
let{data:{user}}=await db.auth.getUser();if(!user)return;
let payload={user_id:user.id,work_date:date,start_time:$("sh").value+":"+$("sm").value+":00",end_time:$("eh").value+":"+$("em").value+":00",break_30:$("break").checked,hours:(mins/60).toFixed(2),day_hours:(mins/60).toFixed(2),night_hours:"0.00"};
let{error}=await db.from("work_entries").upsert(payload,{onConflict:"user_id,work_date"});if(error){showMsg("appMsg","Błąd zapisu: "+error.message);return}showMsg("appMsg","Dzień zapisany.",true);await loadEntries()
}
async function deleteEntry(id){if(!confirm("Usunąć ten dzień?"))return;let{error}=await db.from("work_entries").delete().eq("id",id);if(error){showMsg("appMsg","Nie udało się usunąć: "+error.message);return}await loadEntries()}
function copyText(){let shown=visibleEntries();if(!shown.length){showMsg("appMsg","Brak wpisów w tym miesiącu.");return}let hasNight=shown.some(e=>nmin(e.night_hours)>0),monthNames=["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"],p={month:Number($("filterMonth").value),year:Number($("filterYear").value)},shortH=min=>{let h=Math.floor(min/60),m=min%60;return m?String(h)+","+String(m/60).slice(2)+"h":String(h)+"h"},lines=[];shown.slice().reverse().forEach(e=>{let day=nmin(e.day_hours),night=nmin(e.night_hours),line=e.work_date.split("-").slice(1).reverse().join(".")+" "+e.start_time.slice(0,5)+"-"+e.end_time.slice(0,5)+" ";if(night){line+=shortH(day)+" + "+shortH(night)+" noc"}else{line+=shortH(nmin(e.hours))}lines.push(line)});let total=shown.reduce((s,e)=>s+nmin(e.hours),0),day=shown.reduce((s,e)=>s+nmin(e.day_hours),0),night=shown.reduce((s,e)=>s+nmin(e.night_hours),0);lines.push("","SUMA: "+shortH(total));if(hasNight){lines.push("Dzień: "+shortH(day),"Noc: "+shortH(night))}let text=lines.join("\n");navigator.clipboard.writeText(text).then(()=>showMsg("appMsg","Tekst skopiowany — możesz wkleić go na WhatsApp.",true)).catch(()=>{let ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();showMsg("appMsg","Tekst skopiowany — możesz wkleić go na WhatsApp.",true)})}
async function init(){
fillTimes();let today=new Date();$("date").value=today.toISOString().slice(0,10);let y=today.getFullYear();
for(let i=y-3;i<=y+2;i++){let o=document.createElement("option");o.value=i;o.textContent=i;$("filterYear").appendChild(o)}
let monthNames=["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"];for(let i=1;i<=12;i++){let o=document.createElement("option");o.value=i;o.textContent=monthNames[i-1];$("filterMonth").appendChild(o)}let periodMonth=today.getDate()>=21?today.getMonth()+2:today.getMonth()+1,periodYear=y;if(periodMonth===13){periodMonth=1;periodYear=y+1}$("filterMonth").value=periodMonth;$("filterYear").value=periodYear;updateCalc();updatePeriodLabel();
["sh","sm","eh","em","break"].forEach(id=>$(id).addEventListener("change",updateCalc));["filterMonth","filterYear"].forEach(id=>$(id).addEventListener("change",()=>{updatePeriodLabel();render()}));
$("currentMonthBtn").onclick=()=>{let d=new Date(),pm=d.getDate()>=21?d.getMonth()+2:d.getMonth()+1,py=d.getFullYear();if(pm===13){pm=1;py++}$("filterMonth").value=pm;$("filterYear").value=py;updatePeriodLabel();render()};
$("saveBtn").onclick=save;$("copyBtn").onclick=copyText;$("toggleEntries").onclick=()=>{let e=$("entries");let hidden=e.classList.toggle("collapsed");$("toggleEntries").textContent=hidden?"Pokaż":"Ukryj"};
$("hoursTab").onclick=()=>{$("hoursTab").classList.add("active");$("dietTab").classList.remove("active");$("hoursView").classList.remove("hidden");$("dietView").classList.add("hidden")};
$("dietTab").onclick=async()=>{$("dietTab").classList.add("active");$("hoursTab").classList.remove("active");$("hoursView").classList.add("hidden");$("dietView").classList.remove("hidden");await loadDietWeeks()};
$("dietWeeks").addEventListener("click",async e=>{let b=e.target.closest(".diet-toggle");if(b){e.stopPropagation();await toggleDiet(b.dataset.week);return}let card=e.target.closest(".diet-week");if(card){let key=card.dataset.open;openDietWeek=openDietWeek===key?null:key;renderDiet()}});
$("dietCurrentBtn").onclick=()=>{let now=new Date(),p=isoWeekParts(now);$("dietYear").value=p.year;openDietWeek=null;renderDiet();setTimeout(()=>$("currentDietWeek")?.scrollIntoView({behavior:"smooth",block:"center"}),50)};
$("entries").addEventListener("click",e=>{let b=e.target.closest(".delete");if(b)deleteEntry(b.dataset.id)});
for(let i=y-3;i<=y+2;i++){let o=document.createElement("option");o.value=i;o.textContent=i;$("dietYear").appendChild(o)}
$("dietYear").value=y;

$("dietYear").addEventListener("change",()=>{openDietWeek=null;renderDiet()});
let{data:{session}}=await db.auth.getSession();if(session){$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");$("userEmail").textContent=session.user.email;await loadEntries()}
}
$("loginBtn").onclick=async()=>{let{error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){showMsg("loginMsg","Nieprawidłowy e-mail lub hasło.");return}location.reload()};
$("logoutBtn").onclick=async()=>{await db.auth.signOut();location.reload()};init();
</script>
</body></html>
