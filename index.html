<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Ewidencja pracy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#f5f5f7;background:#0f1014}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#111318,#0b0c0f);min-height:100vh}
.wrap{max-width:680px;margin:auto;padding:20px 16px 40px}
h1{font-size:30px;margin:8px 0 4px}.sub{color:#9b9da6;margin-bottom:22px}
.card{background:#17191f;border:1px solid #292c34;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 30px #0004}
label{display:block;font-size:13px;color:#a9abb4;margin:0 0 7px}
input,select{width:100%;background:#101217;color:#fff;border:1px solid #343741;border-radius:13px;padding:13px;font-size:17px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.time{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.check{display:flex;align-items:center;gap:10px;color:#ddd;font-size:16px}.check input{width:20px;height:20px;accent-color:#8fe388}
.big{font-size:27px;font-weight:700}.muted{color:#999ca6}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:700;cursor:pointer}.primary{background:#e8e9ed;color:#111}.secondary{background:#272a31;color:#fff}.danger{background:#382023;color:#ffb5bc}.small{width:auto;padding:9px 12px;font-size:14px}
.msg{padding:11px 13px;border-radius:12px;margin:10px 0;display:none}.ok{background:#17301e;color:#b9efc2}.err{background:#3a1d20;color:#ffc1c7}
.entry{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid #292c34;padding:14px 0}.entry:first-child{border-top:0}.date{font-weight:700}.hours{font-size:18px;font-weight:700}.delete{border:0;background:#302025;color:#ff9fa8;border-radius:11px;padding:9px 11px}
.total{display:flex;justify-content:space-between;align-items:center;font-size:18px}.total strong{font-size:28px}
.hidden{display:none!important}.login{max-width:440px;margin:12vh auto;padding:20px}.spinner{opacity:.7}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #2b2e35}th{color:#aeb0b8}
@media(max-width:420px){h1{font-size:27px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="card">
    <h1>Ewidencja pracy</h1>
    <div class="sub">Zaloguj się, żeby zobaczyć swoje godziny.</div>
    <label>E-mail</label><input id="email" type="email" autocomplete="username">
    <div style="height:12px"></div>
    <label>Hasło</label><input id="password" type="password" autocomplete="current-password">
    <div style="height:16px"></div>
    <button class="btn primary" id="loginBtn">Zaloguj</button>
    <div id="loginMsg" class="msg err"></div>
  </div>
</div>

<div id="appView" class="wrap hidden">
  <div class="row">
    <div>
      <h1>Ewidencja pracy</h1>
      <div class="sub" id="userEmail"></div>
    </div>
    <button class="btn secondary small" id="logoutBtn">Wyloguj</button>
  </div>

  <div class="card">
    <div class="grid2">
      <div><label>Data</label><input id="date" type="date"></div>
      <div><label>Przerwa</label><label class="check" style="margin-top:9px"><input id="break" type="checkbox"> 30 minut</label></div>
    </div>
    <div style="height:14px"></div>
    <div class="grid2">
      <div><label>Od</label><div class="time"><select id="sh"></select><select id="sm"></select></div></div>
      <div><label>Do</label><div class="time"><select id="eh"></select><select id="em"></select></div></div>
    </div>
    <div style="height:16px"></div>
    <div class="row"><span class="muted">Czas pracy</span><span class="big" id="calc">0:00 h</span></div>
    <div style="height:14px"></div>
    <button class="btn primary" id="saveBtn">Zapisz dzień</button>
    <div id="appMsg" class="msg"></div>
  </div>

  <div class="card">
    <div class="row"><strong>Widok miesiąca</strong><button class="btn secondary small" id="currentMonthBtn">Bieżący</button></div>
    <div style="height:12px"></div>
    <div class="grid2">
      <div><label>Miesiąc</label><select id="filterMonth">
        <option value="1">Styczeń</option><option value="2">Luty</option><option value="3">Marzec</option>
        <option value="4">Kwiecień</option><option value="5">Maj</option><option value="6">Czerwiec</option>
        <option value="7">Lipiec</option><option value="8">Sierpień</option><option value="9">Wrzesień</option>
        <option value="10">Październik</option><option value="11">Listopad</option><option value="12">Grudzień</option>
      </select></div>
      <div><label>Rok</label><select id="filterYear"></select></div>
    </div>
  </div>

  <div class="card">
    <div class="row"><strong>Zapisane dni</strong><span class="muted" id="count"></span></div>
    <div id="entries" style="margin-top:4px"></div>
    <div class="total" style="border-top:1px solid #292c34;padding-top:16px;margin-top:4px">
      <span>SUMA</span><strong id="total">0:00 h</strong>
    </div>
  </div>

  <div class="card">
    <div class="row"><strong>Dla księgowej</strong><button class="btn secondary small" id="csvBtn">Eksport CSV</button></div>
    <div style="overflow:auto;margin-top:10px">
      <table><thead><tr><th>Data</th><th>Godziny</th><th>Łącznie</th></tr></thead><tbody id="report"></tbody></table>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://sofqzwpfsoeysouvklkm.supabase.co";
const SUPABASE_KEY = "sb_publishable_k6BT46z0PkYpDq7a1Nx7yw_1r1tV641";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $=id=>document.getElementById(id);
let entries=[];

function fillTimes(){
  for(let h=0;h<24;h++){for(const id of ["sh","eh"]){const o=document.createElement("option");o.value=String(h).padStart(2,"0");o.textContent=String(h).padStart(2,"0");$(id).appendChild(o)}}
  for(const m of [0,30]){for(const id of ["sm","em"]){const o=document.createElement("option");o.value=String(m).padStart(2,"0");o.textContent=String(m).padStart(2,"0");$(id).appendChild(o)}}
  $("sh").value="07";$("eh").value="15";
}
function minutes(h,m){return Number(h)*60+Number(m)}
function workMinutes(){
  let a=minutes($("sh").value,$("sm").value), b=minutes($("eh").value,$("em").value);
  if(b<=a)b+=1440;
  let x=b-a;
  if($("break").checked)x-=30;
  return Math.max(0,x);
}
function fmt(min){
  const h=Math.floor(min/60),m=min%60;
  return `${h}:${String(m).padStart(2,"0")} h`;
}
function showMsg(id,text,ok=false){const el=$(id);el.textContent=text;el.className="msg "+(ok?"ok":"err");el.style.display="block";setTimeout(()=>el.style.display="none",3500)}
function updateCalc(){$("calc").textContent=fmt(workMinutes())}

async function loadEntries(){
  const {data,error}=await db.from("work_entries").select("*").order("work_date",{ascending:false});
  if(error){showMsg("appMsg","Nie udało się pobrać danych: "+error.message);return}
  entries=data||[];render();
}
function getSelectedPeriod(){
  return {
    month:Number($("filterMonth").value),
    year:Number($("filterYear").value)
  };
}
function visibleEntries(){
  const p=getSelectedPeriod();
  return entries.filter(e=>{
    const d=e.work_date.split("-");
    return Number(d[0])===p.year && Number(d[1])===p.month;
  });
}
function render(){
  const shown=visibleEntries();
  $("count").textContent=shown.length?`${shown.length} dni`:"";
  $("entries").innerHTML=shown.length?shown.map(e=>`
    <div class="entry">
      <div><div class="date">${e.work_date}</div>
      <div class="muted">${e.start_time.slice(0,5)}–${e.end_time.slice(0,5)}</div></div>
      <div class="row"><span class="hours">${fmt(Math.round(Number(e.hours)*60))}</span>
      <button class="delete" data-id="${e.id}">🗑️</button></div>
    </div>`).join(""):`<div class="muted" style="padding:16px 0">Brak zapisanych dni w tym miesiącu.</div>`;
  let total=shown.reduce((s,e)=>s+Math.round(Number(e.hours)*60),0);
  $("total").textContent=fmt(total);
  $("report").innerHTML=shown.map(e=>`<tr><td>${e.work_date}</td><td>${e.start_time.slice(0,5)}–${e.end_time.slice(0,5)}</td><td>${fmt(Math.round(Number(e.hours)*60))}</td></tr>`).join("");
}

async function save(){
  const date=$("date").value;if(!date){showMsg("appMsg","Wybierz datę.");return}
  const mins=workMinutes(); if(mins<=0){showMsg("appMsg","Godzina zakończenia musi być późniejsza od rozpoczęcia.");return}
  const {data:{user}}=await db.auth.getUser(); if(!user)return;
  const payload={user_id:user.id,work_date:date,start_time:`${$("sh").value}:${$("sm").value}:00`,end_time:`${$("eh").value}:${$("em").value}:00`,break_30:$("break").checked,hours:(mins/60).toFixed(2)};
  const {error}=await db.from("work_entries").upsert(payload,{onConflict:"user_id,work_date"});
  if(error){showMsg("appMsg","Błąd zapisu: "+error.message);return}
  showMsg("appMsg","Dzień zapisany.",true);await loadEntries();
}
async function deleteEntry(id){
  if(!confirm("Usunąć ten dzień?"))return;
  const {error}=await db.from("work_entries").delete().eq("id",id);
  if(error){showMsg("appMsg","Nie udało się usunąć: "+error.message);return}
  await loadEntries();
}
function csv(){
  const shown=visibleEntries();
  const p=getSelectedPeriod();
  const rows=[["Data","Godziny","Łącznie"],...shown.map(e=>[e.work_date,`${e.start_time.slice(0,5)}-${e.end_time.slice(0,5)}`,fmt(Math.round(Number(e.hours)*60)).replace(" h","")])];
  const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(";")).join("\r\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ewidencja_pracy.csv";a.click();URL.revokeObjectURL(a.href);
}
async function init(){
  fillTimes();
  const today=new Date();
  $("date").value=today.toISOString().slice(0,10);

  const currentYear=today.getFullYear();
  for(let y=currentYear-3;y<=currentYear+2;y++){
    const o=document.createElement("option");
    o.value=String(y);o.textContent=String(y);$("filterYear").appendChild(o);
  }
  $("filterMonth").value=String(today.getMonth()+1);
  $("filterYear").value=String(currentYear);

  updateCalc();
  ["sh","sm","eh","em","break"].forEach(id=>$(id).addEventListener("change",updateCalc));
  ["filterMonth","filterYear"].forEach(id=>$(id).addEventListener("change",render));
  $("currentMonthBtn").onclick=()=>{
    const d=new Date();
    $("filterMonth").value=String(d.getMonth()+1);
    $("filterYear").value=String(d.getFullYear());
    render();
  };
  $("saveBtn").onclick=save;$("csvBtn").onclick=csv;
  $("entries").addEventListener("click",()=>{});
  const {data:{session}}=await db.auth.getSession();
  if(session){
    $("loginView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    $("userEmail").textContent=session.user.email;
    await loadEntries();
  }
}

$("loginBtn").onclick=async()=>{
  const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});
  if(error){showMsg("loginMsg","Nieprawidłowy e-mail lub hasło.");return}
  location.reload();
};
$("logoutBtn").onclick=async()=>{await db.auth.signOut();location.reload()};
init();
</script>
</body>
</html>
